name: Build MD Auto Clicker Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyautogui pynput pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile --name "MD Auto Clicker Pro" MD_Auto_Clicker_Pro.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MD-Auto-Clicker-Pro
          path: "dist/MD Auto Clicker Pro.exe"
